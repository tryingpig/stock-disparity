name: Update disparity data (US + KR)

on:
  schedule:
    # 한국 시장 (UTC): 장중 09:00~15:40 KST, 마감 16:00 KST
    - cron: '*/20 0-6 * * 1-5'
    - cron: '0 7 * * 1-5'
    # 미국 시장 (UTC): 장중 개장~마감, 마감 후 확정
    - cron: '*/20 13-21 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync KR sector config from Notion   # data/kr/sectors.json 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_from_notion.py

      - name: Fetch data & compute disparity (US + KR)
        run: python scripts/update_data.py us kr

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음 (휴장일 등) — 커밋 생략"
          else
            git commit -m "data: update disparity US+KR ($(date -u +%Y-%m-%d))"
            git push
          fi
